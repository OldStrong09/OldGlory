name: Deploy Apex Ledger to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          set -e
          for f in *.js; do echo "Checking $f"; node --check "$f"; done
      - name: Verify required Apex modules
        run: |
          set -e
          for f in index.html automation_policy.js automation_gates.js qualification_ui.js execution_gateway.js bot_health.js backtest_engine.js simulation_engine.js regime_engine.js; do test -f "$f" || { echo "Missing $f"; exit 1; }; done
          grep -q "LIVE BLOQUEADO" index.html
          grep -q "EXECUTION_GATEWAY_LOCKED" execution_gateway.js
          grep -q "liveExecutionEnabled:false" automation_policy.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
